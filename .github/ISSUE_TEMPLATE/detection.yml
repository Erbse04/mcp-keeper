name: False positive or missed pattern
description: A finding that should not be there, or a poisoning pattern mcp-keeper does not catch.
labels: ["detection"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What happened?
      options:
        - False positive (finding on legitimate text)
        - Missed pattern (malicious or risky text not reported)
        - Wrong severity
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: MCP001
  - type: textarea
    id: text
    attributes:
      label: Text that triggered (or should trigger) the finding
      description: Tool or parameter description, schema, prompt or config entry. Redact secrets and private data.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: mcp-keeper output
      render: text
  - type: input
    id: server
    attributes:
      label: Server package and version (if public)
      placeholder: "some-mcp-server@1.2.3"
  - type: input
    id: version
    attributes:
      label: mcp-keeper version
      placeholder: output of `mcp-keeper --version`
    validations:
      required: true
