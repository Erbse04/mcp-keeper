# .github/workflows/mcp-guard.yml — add this to your MCP server repository
name: mcp-guard
on: [push, pull_request]
permissions:
  contents: read
  security-events: write   # only needed for the SARIF upload
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
      - uses: Erbse04/mcp-guard@v0
        with:
          command: node build/index.js
          fail-on: high
          min-score: 80
          # baseline: mcp-baseline.json   # commit one created with --update-baseline
          sarif: mcp-guard.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: mcp-guard.sarif
